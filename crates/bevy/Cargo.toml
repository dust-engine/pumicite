[package]
name = "bevy_pumicite"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1"
bevy_ecs = "0.20"
bevy_app = "0.20"
bevy_window = { version = "0.20", optional = true }
bevy_ptr = "0.20"
bevy_asset = "0.20"
bevy_tasks = "0.20"
bevy_reflect = "0.20"
bevy_transform = "0.20"
bevy_internal = "0.20"
bevy_platform = "0.20"
indexmap = { version = "2", default-features = false }

async-lock = "3"
glam = "0.33"
pumicite = { path = "../../", features = ["bevy"] }
pumicite_types = { path = "../types" }
ron = { version = "0.12", optional = true }
postcard = { version = "1", optional = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
smallvec = "1.15"
bytemuck = "1.23"

ktx2 = { version = "0.4", optional = true, default-features = false, features = ["std"] }
ddsfile = { version = "0.5", optional = true }
byteorder = { version = "1.5", optional = true }
image = { version = "0.25", default-features = false, optional = true }
png = { version = "0.18", default-features = false, optional = true }

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features=["bevy_winit", "bevy_asset", "multi_threaded"] }

[features]
default = ["bevy_window", "ktx2", "dds", "png", "jpeg", "tiff", "ron", "postcard", "swapchain"]
bevy_window = ["dep:bevy_window"]
dds = ["ddsfile", "byteorder"]
jpeg = ["image", "image/jpeg"]
tiff = ["image", "image/tiff"]
swapchain = []
